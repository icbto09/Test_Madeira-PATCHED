# Stellar Blade: diagnostic capture, not a crash fix.
# Copy these lines into the game's configuration; this file is not auto-loaded.
# Replace duplicate keys rather than appending conflicting values.
# Keep the remaining game settings and -dx11 launch argument unchanged.
# Fully close Madeira before the capture so new threads inherit the flags.

d3d11 = dxvk
vulkan = kosmickrisp
env.DXVK_LOG_LEVEL = info
env.MADEIRA_LOG_TRAIL = 1
env.MADEIRA_SESSION_DIAGNOSTICS = 1
env.MADEIRA_BLOCK_RING = 1

# MADEIRA_BLOCK_RING enables the existing per-thread block-entry RIP ring.
# Source: FEX/FEXCore/include/FEXCore/Core/CoreState.h (ml1205).
# The ring has 4096 entries; this is block history, not a memory-write trace.
# After reproducing, export the complete session log before another launch.
# Check that the crash report contains populated [block-ring] output.
# If it still says no ring on this thread, retain that log for investigation.
# Remove env.MADEIRA_BLOCK_RING after the diagnostic run.
# Tracing may affect execution timing; do not use this run as a benchmark.
